name: End-to-End Suites

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mocked:
    name: Local Plane
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run the Mocked Suite
        run: bun run test:e2e

  integration:
    name: Against Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: mocked
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run the Integration Suite
        env:
          FREE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FREE_CLOUDFLARE_ACCOUNT_ID }}
          FREE_CLOUDFLARE_API_TOKEN: ${{ secrets.FREE_CLOUDFLARE_API_TOKEN }}
        run: bun run test:e2e:integration
